name: Build and Minecraft tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove obsolete template stubs
        run: |
          rm -f src/main/java/net/createindustrialteam/createindustrial/ExampleModClient.java
      - name: Offline logic and resources
        run: python3 tools/run_offline_checks.py
      - name: Compile the full mod
        run: bash gradlew clean build --no-daemon --stacktrace
      # Always upload a successfully compiled test binary *before* GameTests.
      # A failing GameTest must remain a failing workflow, but the JAR is still
      # available to reproduce the failure on a development client.
      - name: Compiled mod (development build only)
        uses: actions/upload-artifact@v4
        with:
          name: createindustrial-welder-dev-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          retention-days: 7
          if-no-files-found: error
      - name: Run Minecraft GameTests
        run: bash gradlew runGameTestServer --no-daemon --stacktrace
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-gametest-logs
          path: |
            build/reports/
            run/logs/
            runs/**/logs/
